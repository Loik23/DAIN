name: echo_call
description: Hyper-Realistic AI Fake Phone Call Simulator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  glassmorphism_ui: ^0.3.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # Audio & Recording
  just_audio: ^0.9.36
  audio_session: ^0.1.16
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.1
  record: ^5.0.4
  
  # AI & TTS
  http: ^1.1.0
  dio: ^5.3.2
  flutter_tts: ^3.8.3
  speech_to_text: ^6.6.0
  
  # Backend & Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_analytics: ^10.7.4
  
  # File & Media
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  video_player: ^2.8.1
  camera: ^0.10.5+5
  
  # Social & Sharing
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  flutter_contacts: ^1.1.7+1
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  
  # UI Enhancements
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_vibrate: ^1.3.0
  haptic_feedback: ^0.5.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.ttf
        - asset: assets/fonts/SF-Pro-Display-Medium.ttf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.ttf
          weight: 700